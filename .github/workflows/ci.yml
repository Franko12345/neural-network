name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy pygame-ce
          # tests/ and scripts run with SDL_VIDEODRIVER=dummy for viz smoke

      - name: Headless tests (numpy math)
        run: |
          # Once tests/test_nn.py exists (ticket 03), this is the real gate.
          # Until then, this is a placeholder that imports nn.py to catch
          # syntax errors / import-time crashes.
          python -c "import sys; sys.path.insert(0, '.'); import nn; print('nn.py imports ok')"

      - name: Headless smoke (visualizer)
        run: |
          # Runs main.py under dummy SDL so pygame inits without a display.
          # Once main.py exists (ticket 05), this exercises the full loop.
          # Until then, a no-op smoke check that pygame imports.
          SDL_VIDEODRIVER=dummy python -c "import pygame; pygame.init(); print('pygame headless ok')"